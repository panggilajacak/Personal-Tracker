<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Personal Tracker v1.0</title>
<style>
:root{--a:#6366f1;--blur:18px;--ga:.35;--txt:#0f172a;--mut:#475569;--bd:rgba(255,255,255,.65);--in:rgba(255,255,255,.6);--md:rgba(255,255,255,.94);--bg1:#c7d2fe;--bg2:#fbcfe8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--txt:#f1f5f9;--mut:#a5b4cc;--bd:rgba(255,255,255,.18);--in:rgba(255,255,255,.08);--md:rgba(22,30,46,.95);--bg1:#0f172a;--bg2:#312e81}}
:root[data-theme="dark"]{--txt:#f1f5f9;--mut:#a5b4cc;--bd:rgba(255,255,255,.18);--in:rgba(255,255,255,.08);--md:rgba(22,30,46,.95)}
:root[data-theme="light"]{--txt:#0f172a;--mut:#475569;--bd:rgba(255,255,255,.65);--in:rgba(255,255,255,.6);--md:rgba(255,255,255,.95)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:15px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--a) 38%,transparent),transparent 42%),radial-gradient(circle at 88% 90%,color-mix(in srgb,var(--a) 28%,transparent),transparent 40%),linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;background-color:var(--bg1)}
.wrap{max-width:1120px;margin:0 auto;padding:16px 14px 70px}
.glass{background:rgba(255,255,255,var(--ga));backdrop-filter:blur(var(--blur)) saturate(160%);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border:1px solid var(--bd);border-radius:22px;box-shadow:0 8px 32px rgba(0,0,0,.12)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
h1{font-size:1.3rem;margin:0}h2{margin:0 0 10px;font-size:1.05rem}h3{margin:0;font-size:1rem}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--bd);background:var(--in);border-radius:12px;padding:8px 14px;transition:.15s}
.btn:hover{transform:translateY(-1px)}
.pri,.on{background:var(--a)!important;color:#fff!important;border-color:transparent!important}
.pri{font-weight:600}
.ic{width:40px;height:40px;padding:0;font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--in);border-radius:999px;padding:7px 14px;font-size:.88rem}
input,select,textarea{background:var(--in);border:1px solid var(--bd);color:var(--txt);border-radius:12px;padding:9px 12px;font:inherit;width:100%;min-width:0}
input[type=color]{padding:3px;height:40px;cursor:pointer}input[type=range]{padding:0;accent-color:var(--a)}
input[type=checkbox]{width:auto;accent-color:var(--a);cursor:pointer}select option{color:#0f172a;background:#fff}
.sec{padding:16px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px;margin-bottom:14px}
.g2 .sec{margin:0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.k{padding:14px 16px;text-align:left;display:block;width:100%}.k b{display:block;font-size:1.35rem}.k span{color:var(--mut);font-size:.8rem}
.hello{font-size:1.45rem;font-weight:700}.mut,.note{color:var(--mut);font-size:.84rem}
.fr{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}.fr>*{flex:1 1 110px}.fr>.btn,.fr>.chip{flex:0 0 auto}
.bar{height:11px;border-radius:99px;background:var(--in);overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--mut)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.top h3{margin:0;font-size:1.05rem;word-break:break-word}
.badge{font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--in);border:1px solid var(--bd);white-space:nowrap}
.card{padding:16px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pc{font-weight:700;color:var(--txt);font-size:1.05rem}.nums b{font-size:1.2rem}
.tk{display:flex;gap:6px;align-items:center;font-size:.9rem;flex-wrap:wrap}.tk span{flex:1;word-break:break-word}.dn{text-decoration:line-through;opacity:.6}
.sub{margin-left:8px;padding-left:10px;border-left:2px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.mini{border:0;background:none;opacity:.8;padding:3px 6px;font-size:.9rem;border-radius:8px;transition:.12s}.mini:hover{background:var(--in);opacity:1}
.ar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}.ar input{padding:6px 10px}.ar .btn{padding:6px 12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts .btn{padding:6px 11px;font-size:.84rem}
.late,.out{color:#ef4444}.ok,.in{color:#10b981}.late,.ok{font-weight:600}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border-bottom:none}
.ch{display:flex;gap:3px;align-items:flex-end;height:130px}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;min-width:0}
.bp{flex:1;width:100%;display:flex;gap:1px;align-items:flex-end}.bp i{flex:1;border-radius:3px 3px 0 0;min-height:2px}
.cb{position:relative}.cb small{font-size:.58rem;color:var(--mut)}.cb[title]{cursor:help}
.ch-legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.78rem;color:var(--mut);margin-bottom:8px}
.ch-legend span{display:inline-flex;align-items:center;gap:5px}
.ch-legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.ch-note{font-size:.78rem;color:var(--mut);margin-top:8px;padding:7px 10px;border-radius:10px;background:var(--in);border:1px solid var(--bd);line-height:1.4}
.lv{display:flex;gap:8px;margin-bottom:10px}.lv button{flex:1;font-size:1.5rem;padding:10px 0}
.dots{display:flex;gap:5px}.dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:var(--in);font-size:.7rem;padding:0}
.empty{text-align:center;padding:28px;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}.ov.on{display:flex}
.md{background:var(--md);color:var(--txt);max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:20px;border-radius:22px;border:1px solid var(--bd);box-shadow:0 16px 48px rgba(0,0,0,.25)}.md h2{font-size:1.18rem;color:var(--txt)}
:root[data-theme="light"] .md, :root[data-theme="light"] .md p, :root[data-theme="light"] .md li, :root[data-theme="light"] .md .note, :root[data-theme="light"] .md h2, :root[data-theme="light"] .md b{color:#0f172a}
:root[data-theme="light"] .md .note{color:#334155}
.vtabs{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.vtabs .chip{text-align:left;border-radius:12px;padding:9px 14px;font-weight:500}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f .w{grid-column:1/-1}
label.l{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--mut)}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd)}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.ov .md{max-height:calc(100vh - 32px)}@supports(height:100dvh){.ov .md{max-height:calc(100dvh - 32px)}}
#ovS .foot{position:sticky;bottom:-20px;margin:14px -20px -20px;padding:12px 20px;background:var(--md);border-top:1px solid var(--bd);border-radius:0 0 22px 22px;z-index:2}
.impr{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#ovC{z-index:80}
@media(max-width:540px){.f{grid-template-columns:1fr}.hello{font-size:1.22rem}}
.clock{font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.2}
.hdr{display:flex;gap:8px;align-items:center}
a.btn{text-decoration:none;display:inline-block;color:inherit}

/* Home Today Habits Modern Monitor */
.hab-today-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:10px;margin-top:12px}
.hab-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-radius:16px;background:var(--in);border:1px solid var(--bd);transition:transform .15s,background .2s,border-color .2s}
.hab-card:hover{transform:translateY(-1px)}
.hab-card.is-done{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.45)}
.hab-card.is-fail{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.45)}
.hab-card.is-skip{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.45)}
.hab-chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--bd);background:var(--in);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;flex-shrink:0;transition:.15s;padding:0}
.hab-chk.st-done{background:#10b981;color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(16,185,129,.45)}
.hab-chk.st-auto{background:rgba(16,185,129,.22);border:1.5px dashed #10b981;color:var(--txt);font-size:.75rem}
.hab-chk.st-fail{background:#ef4444;color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(239,68,68,.4)}
.hab-chk.st-skip{background:#f59e0b;color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(245,158,11,.4)}
.hab-info{flex:1;min-width:0}
.hab-title{font-weight:600;font-size:.93rem;word-break:break-word;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.hab-sub{font-size:.74rem;color:var(--mut);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hab-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.hab-step{border:1px solid var(--bd);background:var(--in);border-radius:9px;padding:4px 8px;font-size:.78rem;font-weight:700;transition:.12s}
.hab-step:hover{background:#10b981;color:#fff;border-color:transparent}

.hd-opt{font-weight:600;transition:.15s}
.hd-opt.st-1.on{background:#10b981!important;color:#fff!important;border-color:transparent!important;box-shadow:0 4px 12px rgba(16,185,129,.35)}
.hd-opt.st-2.on{background:#ef4444!important;color:#fff!important;border-color:transparent!important;box-shadow:0 4px 12px rgba(239,68,68,.35)}
.hd-opt.st-3.on{background:#f59e0b!important;color:#fff!important;border-color:transparent!important;box-shadow:0 4px 12px rgba(245,158,11,.35)}
.hd-opt.st-0.on{background:#64748b!important;color:#fff!important;border-color:transparent!important}

/* Habits Calendar */
.ds{display:flex;gap:6px;overflow-x:auto;padding:14px 2px 6px;position:relative;scroll-snap-type:x proximity}
.dd{flex:0 0 50px;border:1px solid var(--bd);background:var(--in);border-radius:12px;padding:5px 0;text-align:center;line-height:1.15;scroll-snap-align:center;position:relative}
.dd small{display:block;font-size:.6rem;color:var(--mut)}.dd b{display:block;font-size:.85rem}.dd i{display:block;font-style:normal;font-size:.9rem;margin-top:2px;font-weight:700}
.dd.s1{background:#10b981;color:#fff;border-color:transparent}.dd.s1 small{color:rgba(255,255,255,.9)}
.dd.s2{background:#ef4444;color:#fff;border-color:transparent}.dd.s2 small{color:rgba(255,255,255,.9)}
.dd.s3{background:#f59e0b;color:#fff;border-color:transparent}.dd.s3 small{color:rgba(255,255,255,.9)}
.dd.sauto{background:rgba(16,185,129,.22);border:1.5px dashed #10b981;color:var(--txt)}
.dd.tdy{outline:2.5px solid var(--a);box-shadow:0 0 12px color-mix(in srgb,var(--a) 55%,transparent);transform:translateY(-2px)}
.tdy-tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--a);color:#fff;font-size:.54rem;font-weight:700;padding:1px 5px;border-radius:6px;white-space:nowrap;letter-spacing:.3px}
.nt-dot{position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:#3b82f6;border:1px solid #fff}
.dd.ws{border-left:3px solid var(--a)}

/* Time Tracker Tiles & Presets */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{color:#fff;border:0;border-radius:18px;padding:14px 8px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tile span{font-size:1.7rem;display:block}.tile small{display:block;opacity:.92;font-size:.72rem;margin-top:2px}
.tile.run{outline:3px solid #fff;animation:pl 1.2s infinite alternate}@keyframes pl{to{transform:scale(1.03)}}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.preset-btn{border:1px solid var(--bd);background:var(--in);border-radius:999px;padding:5px 10px;font-size:.78rem;display:inline-flex;align-items:center;gap:4px}
.preset-btn:hover{background:var(--a);color:#fff}

/* Compact Pomodoro */
.pomo-mini{padding:11px 14px;margin-bottom:14px}
.pomo-mini-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.pomo-clock-sm{font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--a)}

/* Sticky Notes */
.sticky-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sticky{border-radius:16px;padding:14px;border:1px solid rgba(0,0,0,.08);box-shadow:0 6px 18px rgba(0,0,0,.1);display:flex;flex-direction:column;justify-content:space-between;min-height:135px;color:#0f172a;position:relative;transition:.15s}
.sticky:hover{transform:translateY(-2px)}
.sticky-txt{white-space:pre-wrap;word-break:break-word;font-size:.9rem;line-height:1.4;margin-bottom:10px}
.sticky-ft{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;opacity:.75;border-top:1px solid rgba(0,0,0,.08);padding-top:6px}
.sticky-ft button{border:0;background:none;padding:2px 5px;color:#0f172a;font-size:.85rem}

/* Satisfy Section */
.piano-wrap{overflow-x:auto;padding:10px 4px;user-select:none}
.piano{position:relative;display:inline-flex;height:165px;background:#1e293b;padding:8px 8px 12px;border-radius:14px;box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.wkey{width:42px;height:145px;background:linear-gradient(#fff,#f1f5f9);border:1px solid #cbd5e1;border-radius:0 0 8px 8px;margin-right:2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;color:#475569;font-size:.66rem;font-weight:600;position:relative;z-index:1;transition:.06s;line-height:1.15}
.wkey small{font-size:.58rem;color:#94a3b8;font-weight:700;text-transform:uppercase}
.wkey:active,.wkey.act{background:linear-gradient(#e2e8f0,#cbd5e1);transform:translateY(2px)}
.bkey{width:28px;height:92px;background:linear-gradient(#334155,#0f172a);border:1px solid #020617;border-radius:0 0 6px 6px;position:absolute;top:8px;z-index:2;color:#94a3b8;font-size:.56rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:5px;transition:.06s;line-height:1.1}
.bkey small{font-size:.55rem;color:#cbd5e1;font-weight:700;text-transform:uppercase}
.bkey:active,.bkey.act{background:var(--a);transform:translateY(2px)}

/* Chess Board */
.chess-board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:min(100%,352px);height:min(84vw,352px);margin:0 auto;border-radius:12px;overflow:hidden;border:2px solid var(--bd);box-shadow:0 8px 24px rgba(0,0,0,.18);table-layout:fixed}
.csq{width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;cursor:pointer;user-select:none;position:relative}
.csq.lt{background:#f1f5f9;color:#0f172a}.csq.dk{background:#64748b;color:#0f172a}
.csq.sel{background:#fde047!important}
.csq.mv::after{content:"";width:11px;height:11px;border-radius:50%;background:rgba(16,185,129,.8);position:absolute}
.csq.cap{box-shadow:inset 0 0 0 3px #ef4444}

/* Squishy */
.squish-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 10px;position:relative;overflow:hidden;min-height:260px;user-select:none;touch-action:none;border-radius:16px;background:var(--in);border:1px solid var(--bd)}
.squish-obj{width:150px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;position:relative;transform-origin:center center;will-change:transform}
.squish-obj:active{cursor:grabbing}
.squish-face{font-size:2.2rem;pointer-events:none;z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.sq-mochi{border-radius:46% 54% 48% 52% / 52% 45% 55% 48%;background:radial-gradient(circle at 32% 28%,#fff7,transparent 45%),linear-gradient(135deg,#f472b6,#a855f7);box-shadow:0 16px 32px rgba(168,85,247,.35),inset 0 -10px 20px rgba(0,0,0,.18)}
.sq-sponge{width:165px;height:125px;border-radius:20px;background:radial-gradient(circle at 25% 30%,#fde047,#eab308);box-shadow:0 14px 26px rgba(234,179,8,.35),inset 0 -14px 0 #16a34a,inset 0 6px 12px #fef9c3;background-image:radial-gradient(rgba(161,98,7,.35) 3px,transparent 4px),radial-gradient(rgba(161,98,7,.28) 4px,transparent 5px);background-size:26px 26px,34px 34px;background-position:0 0,13px 15px;background-color:#facc15}
.sq-strawberry{width:142px;height:156px;border-radius:50% 50% 50% 50% / 38% 38% 62% 62%;background:radial-gradient(circle at 30% 25%,#fda4af,transparent 40%),linear-gradient(160deg,#fb7185,#e11d48);box-shadow:0 16px 30px rgba(225,29,72,.35),inset 0 -10px 18px rgba(136,19,55,.35)}
.sq-strawberry::before{content:"🌿";position:absolute;top:-16px;font-size:2.4rem;pointer-events:none}
.sq-orange{width:152px;height:146px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fed7aa,transparent 42%),linear-gradient(145deg,#fb923c,#ea580c);box-shadow:0 16px 30px rgba(234,88,12,.35),inset 0 -10px 18px rgba(124,45,18,.3)}
.sq-orange::before{content:"🍃";position:absolute;top:-14px;right:38px;font-size:1.6rem;pointer-events:none}
.sq-banana{width:175px;height:95px;border-radius:20px 20px 90px 90px / 15px 15px 75px 75px;background:linear-gradient(180deg,#fef08a,#facc15 60%,#ca8a04);box-shadow:0 14px 28px rgba(202,138,4,.35),inset 0 -8px 14px rgba(113,63,18,.25)}

/* Ocean Water Ripple Canvas */
.water-wrap{position:relative;width:100%;height:260px;border-radius:16px;overflow:hidden;border:1px solid var(--bd);touch-action:none;cursor:pointer;background:#0284c7}
.water-wrap canvas{width:100%;height:100%;display:block}

/* Breathing Visualizer */
.breath-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px;position:relative;overflow:hidden;border-radius:16px;background:var(--in);border:1px solid var(--bd)}
.breath-svg{width:100%;max-width:340px;height:175px;display:block;overflow:visible}
.breath-hud{display:flex;align-items:baseline;justify-content:center;gap:12px;margin-top:4px}
.breath-phase{font-size:1.05rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--a)}
.breath-sec{font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums}

/* Tasks style */
.gtask-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:14px;background:var(--in);border:1px solid var(--bd);margin-bottom:8px;transition:transform .12s,box-shadow .12s}
.gtask-item.dragging{opacity:.55;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.gtask-body{flex:1;min-width:0}
.gtask-title{font-weight:500;word-break:break-word}
.gtask-meta{font-size:.76rem;color:var(--mut);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sub-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 6px;border-radius:10px;background:rgba(255,255,255,.15)}
.sub-main{display:flex;align-items:center;gap:6px;flex:1;min-width:0;flex-wrap:wrap;font-size:.86rem}
.sub-time-tag{font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--in);border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
.sub-time-tag.late{color:#ef4444;border-color:rgba(239,68,68,.4);font-weight:600}

.star-btn{border:0;background:transparent!important;font-size:1.3rem;line-height:1;padding:2px 5px;color:#64748b;transition:transform .15s,color .15s}
.star-btn:hover{transform:scale(1.18);color:#eab308}
.star-btn.on{color:#facc15!important;background:transparent!important;text-shadow:0 1px 3px rgba(161,98,7,.55),0 0 8px rgba(250,204,21,.45)}
:root[data-theme="light"] .star-btn{color:#64748b}
:root[data-theme="light"] .star-btn.on{color:#eab308!important;text-shadow:0 1px 2px rgba(113,63,18,.4)}

.cat-pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bd);background:var(--in);border-radius:999px;padding:4px 10px;font-size:.82rem;white-space:nowrap}
.cat-pill.on{background:var(--a);color:#fff;border-color:transparent}
.cat-pill button{border:0;background:none;padding:0 2px;font-size:.78rem;opacity:.85}
.cat-pill button:hover{opacity:1}
.fav-chip.on{background:linear-gradient(135deg,#eab308,#f59e0b)!important;color:#fff!important;border-color:transparent!important}
.ord-btns{display:inline-flex;flex-direction:column;gap:1px}
.ord-btns button{border:1px solid var(--bd);background:var(--in);border-radius:6px;padding:1px 5px;font-size:.65rem;line-height:1.1}
.ord-btns button:hover{background:var(--a);color:#fff}
.hdrag{cursor:grab;user-select:none;padding:3px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--in);font-size:.85rem;line-height:1.2;display:inline-flex;align-items:center}
.card.dragging{opacity:.5}
.card.hcard-drop{outline:2px dashed var(--a);outline-offset:2px}
.rt-badge{color:#0ea5e9;border-color:rgba(14,165,233,.45)}

/* Floating Music Player */
#mp{position:fixed;right:12px;bottom:12px;width:min(330px,calc(100vw - 24px));z-index:45;display:none;padding:10px 12px;font-size:.8rem;border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.22)}
#mp.on{display:block}
#mp.min{width:auto;min-width:140px;padding:6px 12px}
#mp.min .mp-body{display:none}
.sc-it{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:9px;font-size:.75rem;cursor:pointer;border:1px solid transparent;transition:.12s}
.sc-it:hover{background:var(--in)}
.sc-it.on{background:var(--in);border-color:var(--a);font-weight:600;color:var(--a)}
.sc-it.bad{opacity:.55;text-decoration:line-through}
.sc-it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mp-ctl .btn{padding:5px 9px;font-size:.88rem;border-radius:10px}
.sc-bar-wrap{height:8px;border-radius:99px;background:var(--in);border:1px solid var(--bd);cursor:pointer;margin:7px 0 3px;overflow:hidden;position:relative}
.sc-bar-fill{display:block;height:100%;width:0%;background:var(--a);border-radius:99px;pointer-events:none;transition:width .15s linear}

/* Debt History Log */
.dlog-list{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;background:var(--in);border:1px solid var(--bd)}
.dlog-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--bd);font-size:.82rem}
.dlog-item:last-child{border-bottom:none;padding-bottom:0}

/* Energy Tips */
.tip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:8px}
.tip-card{padding:12px;border-radius:14px;background:var(--in);border:1px solid var(--bd);font-size:.85rem}
.tip-card b{display:block;margin-bottom:4px;color:var(--txt)}

.fg{display:block;margin:0 auto;width:100%;max-width:250px;height:190px;color:var(--txt)}
.lg{max-height:150px;overflow:auto;font-size:.82rem;display:flex;flex-direction:column;gap:3px}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--md);color:var(--txt);border:1px solid var(--bd);padding:12px 18px;border-radius:14px;z-index:90;display:none;max-width:90vw;backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(0,0,0,.2)}#toast.on{display:block}
.foot2{text-align:center;color:var(--mut);font-size:.82rem;margin:28px 0 8px}.foot2 a,.md a{color:var(--a);text-decoration:none;font-weight:600}
</style>
</head>

<header>

<label class="l w">Judul<input id="eTitle" maxlength="80"></label>

<label class="l n">Target<input id="eTgt" type="number" min="0" step="any"></label>
<label class="l n">Satuan<input id="eUnit"></label>
<label class="l n">Langkah +/−<input id="eStep" type="number" min="0" step="any"></label>
<label class="l">Tenggat<input id="eDue" type="date"></label>
<label class="l">Warna<input id="eCol" type="color"></label>
<label class="l w">Catatan<textarea id="eNote" rows="2"></textarea></label>
</div>
<div class="foot"><button class="btn" id="eX">Batal</button><button class="btn pri" id="eS">Simpan</button></div>
</div></div>

<!-- Modal Kategori Task / Habit -->
<div class="ov" id="ovGTL"><div class="md glass" style="max-width:400px">

<label class="l w"><span id="gtlLbl">Nama kategori daftar task</span><input id="gtlName" maxlength="40" placeholder="Mis. Proyek, Kuliah, Belanja..."></label>

<div class="foot"><button class="btn" id="gtlX">Batal</button><button class="btn pri" id="gtlS">Simpan</button></div>
</div></div>

<!-- Modal Edit Task -->
<div class="ov" id="ovGTE"><div class="md glass" style="max-width:460px">

<div class="f">
<label class="l w">Judul Task<input id="gteTitle" maxlength="140"></label>
<label class="l">Kategori<select id="gteList"></select></label>
<label class="l">Favorit<select id="gteStar"><option value="0">☆ Tidak</option><option value="1">★ Favorit</option></select></label>
<label class="l">Tanggal Jatuh Tempo<input id="gteDue" type="date"></label>
<label class="l">Waktu / Jam Jatuh Tempo<input id="gteTime" type="time"></label>

</div>
<div class="foot"><button class="btn" id="gteX">Batal</button><button class="btn pri" id="gteS">Simpan Perubahan</button></div>
</div></div>

<!-- Modal Edit Sub-task -->
<div class="ov" id="ovGTSE"><div class="md glass" style="max-width:430px">
<h2>✎ Edit Sub-task</h2>
<div class="f">
<label class="l w">Judul Sub-task<input id="gtseTitle" maxlength="140"></label>
<label class="l">Tanggal Jatuh Tempo<input id="gtseDue" type="date"></label>
<label class="l">Waktu / Jam Sub-task<input id="gtseTime" type="time"></label>
</div>
<div class="foot"><button class="btn" id="gtseX">Batal</button><button class="btn pri" id="gtseS">Simpan Perubahan</button></div>
</div></div>

<!-- Modal Konfirmasi Umum -->
<div class="ov" id="ovC"><div class="md glass" style="max-width:400px">
<h2 id="cTitle">Konfirmasi</h2>

<div class="foot"><button class="btn" id="cNo">Batal</button><button class="btn pri" id="cYes">Ya, Lanjutkan</button></div>
</div></div>

<!-- Modal Edit Riwayat Waktu -->

<div class="foot"><button class="btn" id="hdX">Tutup</button><button class="btn pri" id="hdS">Simpan</button></div>

</div></div>

<div class="foot"><button class="btn" id="snX">Batal</button><button class="btn pri" id="snS">Simpan</button></div>
</div></div>
